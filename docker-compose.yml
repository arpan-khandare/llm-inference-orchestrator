services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_orchestrator
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped